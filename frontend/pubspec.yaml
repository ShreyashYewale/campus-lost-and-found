name: campus_lost_found
description: "Campus Lost & Found - A cross-platform app to connect lost and found items."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  
  # HTTP & API
  http: ^1.1.0
  
  # Storage
  shared_preferences: ^2.2.0
  
  # UI/UX
  flutter_dotenv: ^5.1.0
  
  # Routing
  go_router: ^11.0.0
  
  # Date/Time
  intl: ^0.18.0
  
  # Utilities
  uuid: ^4.0.0
  logger: ^2.0.0

  # Media
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  
  # Testing
  mocktail: ^1.0.0
  
  # Code generation
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
