name: Flutter Web CI/CD

on:
  push:
    branches: [ master, develop, staging ]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ master, develop, staging ]
    paths:
      - 'frontend/**'

jobs:
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Install dependencies
      working-directory: ./frontend
      run: flutter pub get
    
    - name: Analyze code
      working-directory: ./frontend
      run: flutter analyze
    
    - name: Run tests
      working-directory: ./frontend
      run: flutter test

  build-web:
    name: Build Web
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Install dependencies
      working-directory: ./frontend
      run: flutter pub get
    
    - name: Build Web (Dev)
      if: github.ref == 'refs/heads/develop'
      working-directory: ./frontend
      run: flutter build web --release -t lib/main.dart
    
    - name: Build Web (Staging)
      if: github.ref == 'refs/heads/staging'
      working-directory: ./frontend
      run: flutter build web --release -t lib/main.dart
    
    - name: Build Web (Production)
      if: github.ref == 'refs/heads/master'
      working-directory: ./frontend
      run: flutter build web --release -t lib/main.dart
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: web-build
        path: frontend/build/web/

  deploy-dev:
    name: Deploy to Dev
    needs: build-web
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: web-build
        path: ./dist/
    
    - name: Deploy to Firebase Hosting (Dev)
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'
        channelId: dev
        projectId: campus-lost-found-dev

  deploy-staging:
    name: Deploy to Staging
    needs: build-web
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: web-build
        path: ./dist/
    
    - name: Deploy to Firebase Hosting (Staging)
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}'
        channelId: staging
        projectId: campus-lost-found-staging

  deploy-prod:
    name: Deploy to Production
    needs: build-web
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: web-build
        path: ./dist/
    
    - name: Deploy to Firebase Hosting (Production)
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}'
        projectId: campus-lost-found-prod

  notify:
    name: Notify Deployment
    needs: [ deploy-dev, deploy-staging, deploy-prod ]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: Notify Slack
      uses: slackapi/slack-github-action@v1
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "Campus Lost & Found Deployment",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deployment Status*\nRef: ${{ github.ref }}\nStatus: ${{ job.status }}"
                }
              }
            ]
          }
