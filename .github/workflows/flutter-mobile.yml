name: Flutter Mobile CI/CD

on:
  push:
    branches: [ master, staging ]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ master, staging ]
    paths:
      - 'frontend/**'

jobs:
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Install dependencies
      working-directory: ./frontend
      run: flutter pub get
    
    - name: Analyze code
      working-directory: ./frontend
      run: flutter analyze
    
    - name: Run tests
      working-directory: ./frontend
      run: flutter test

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Install dependencies
      working-directory: ./frontend
      run: flutter pub get
    
    - name: Build APK (Dev)
      if: github.ref == 'refs/heads/develop'
      working-directory: ./frontend
      run: flutter build apk --release -t lib/main.dart
    
    - name: Build APK (Production)
      if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
      working-directory: ./frontend
      run: flutter build appbundle --release -t lib/main.dart
    
    - name: Upload Android build
      uses: actions/upload-artifact@v3
      with:
        name: android-build
        path: |
          frontend/build/app/outputs/apk/release/
          frontend/build/app/outputs/bundle/release/

  build-ios:
    name: Build iOS App
    needs: test
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Install CocoaPods dependencies
      working-directory: ./frontend/ios
      run: pod repo update && pod install
    
    - name: Install app dependencies
      working-directory: ./frontend
      run: flutter pub get
    
    - name: Build iOS (Dev)
      if: github.ref == 'refs/heads/develop'
      working-directory: ./frontend
      run: flutter build ios --release -t lib/main.dart --no-codesign
    
    - name: Build iOS (Production)
      if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
      working-directory: ./frontend
      run: flutter build ios --release -t lib/main.dart --no-codesign
    
    - name: Upload iOS build
      uses: actions/upload-artifact@v3
      with:
        name: ios-build
        path: frontend/build/ios/

  create-release:
    name: Create GitHub Release
    needs: [ build-android, build-ios ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download artifacts
      uses: actions/download-artifact@v3
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          android-build/**
          ios-build/**
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
